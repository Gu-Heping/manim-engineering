name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Manim / manimpango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest

  geometry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Manim / manimpango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Geometry-only regression gates
        run: |
          pytest tests/layout/test_scene_bbox.py -q
          pytest tests/layout/test_geometry_overlap.py -q
          pytest tests/layout/test_layout_stress.py -q
          pytest tests/layout/test_analog_geometry_smoke.py -q
          pytest tests/waveform/test_step_polyline_reveal.py -q
          pytest tests/waveform/test_smooth_polyline_reveal.py -q
          pytest tests/examples/test_smoke_entrypoints.py -q

