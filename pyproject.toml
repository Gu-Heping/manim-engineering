[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-engineering"
version = "0.1.0"
description = "Semantic engineering visualization framework on Manim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
manim = ["manim==0.19.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "manim==0.19.1",
]

[project.urls]
Repository = "https://github.com/example/manim-engineering"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "requires_manim: needs manim installed (see project optional-dependencies)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["manim_engineering"]
